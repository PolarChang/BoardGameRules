name: Isolated knowledge fixture
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  isolated-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/rule_knowledge/requirements-ci.txt
      - run: python -m pip install -r tests/rule_knowledge/requirements-ci.txt
      - run: python -m pytest tests/rule_knowledge -q --junitxml=tmp/ci-backend.xml
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          KNOWLEDGE_DISABLE_LOCAL_ENV: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-backend-results
          path: tmp/ci-backend.xml
